const doc=JSON.parse(new TextDecoder().decode(raw.slice(20,20+jlen))),bin=raw.slice(28+jlen);

const program=gl.createProgram();
gl.attachShader(program,shader(gl.VERTEX_SHADER,`#version 300 es
in vec3 position;in vec3 normal;in vec2 uv;uniform mat4 vp;out vec3 n;out vec2 t;
void main(){gl_Position=vp*vec4(position,1.);n=normal;t=uv;}`));

precision highp float;in vec3 n;in vec2 t;uniform sampler2D image;out vec4 frag;
void main(){vec3 light=normalize(vec3(-.35,.6,.72));float shade=.66+.34*max(dot(normalize(n),light),0.);frag=vec4(texture(image,t).rgb*shade,1.);}`));

function normalize(v){const l=Math.hypot(...v);return v.map(x=>x/l);}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
